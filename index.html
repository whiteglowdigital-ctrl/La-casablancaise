<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ─── SEO & partage : à adapter pour chaque client (voir README.md) ─── -->
  <title>La Casablancaise — Restaurant, Thiès</title>
  <meta name="description" content="Restaurant à Thiès : spécialités marocaines, cuisine sénégalaise, grillades, pizzas et crêpes, dans un cadre élégant. Commande en ligne, retrait sur place ou livraison.">
  <meta name="theme-color" content="#1d3b2f">
  <meta property="og:type" content="restaurant">
  <meta property="og:locale" content="fr_SN">
  <meta property="og:site_name" content="La Casablancaise">
  <meta property="og:title" content="La Casablancaise — Restaurant, Thiès">
  <meta property="og:description" content="Restaurant à Thiès : spécialités marocaines, cuisine sénégalaise, grillades, pizzas et crêpes, dans un cadre élégant. Commande en ligne, retrait sur place ou livraison.">
  <meta property="og:image" content="https://whiteglowdigital-ctrl.github.io/La-casablancaise/images/og.jpg">
  <meta property="og:url" content="https://whiteglowdigital-ctrl.github.io/La-casablancaise/">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Une table dressée à La Casablancaise, Thiès">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "La Casablancaise",
    "image": "https://whiteglowdigital-ctrl.github.io/La-casablancaise/images/og.jpg",
    "address": { "@type": "PostalAddress", "streetAddress": "183 Rue de Verdun", "addressLocality": "Thiès", "addressCountry": "SN" },
    "telephone": "+221764052386",
    "email": "contact@lacasablancaise.fr",
    "servesCuisine": ["Marocaine", "Sénégalaise", "Grillades", "Pizzas", "Crêpes"],
    "openingHoursSpecification": [{
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
      "opens": "10:00", "closes": "23:59"
    }],
    "sameAs": ["https://www.instagram.com/lacasablancaise_thies"]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="commande.css">
</head>
<body>
  <a class="skip" href="#carte">Aller à la carte</a>

  <!-- Le contenu de chaque bloc est injecté par render.js à partir de content.js -->
  <div class="topbar" id="topbar"></div>
  <header class="header" id="header"></header>

  <main>
    <section class="hero" id="accueil"></section>
    <div class="features" id="features"></div>
    <section class="about section" id="histoire"></section>
    <section class="signature section" id="carte"></section>
    <section class="special section" id="special"></section>
    <!-- construite par commande.js -->
    <section class="order section" id="commande" aria-label="Commander en ligne"></section>
    <section class="gallery section" id="galerie"></section>
    <section class="reservation section" id="reservation"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- ordre de chargement : données → rendu → module de commande -->
  <script src="content.js"></script>
  <script src="render.js"></script>
  <script src="commande.js"></script>
</body>
</html>
